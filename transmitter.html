<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW TRANSMITTER</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080b10;color:#fff;
  font-family:Arial,sans-serif;text-align:center
}
.wrap{max-width:600px;margin:auto;padding:20px}
h1{margin:10px 0;color:#00e5ff}
.card{
  background:#111720;border:1px solid #26313d;
  border-radius:16px;padding:20px;margin-top:20px
}
button{
  width:100%;padding:15px;margin:7px 0;
  border:0;border-radius:10px;
  background:#00a8ff;color:#fff;font-size:16px;
  font-weight:bold
}
button:active{transform:scale(.98)}
#status{margin:15px 0;font-weight:bold}
input{
  width:100%;padding:13px;border-radius:9px;
  border:1px solid #334;background:#080b10;color:white
}
</style>
</head>

<body>
<div class="wrap">
<h1>AVEDOW TRANSMITTER</h1>

<div class="card">
  <div id="status">🔴 OFFLINE</div>

  <button onclick="connect()">🔗 HUBUNGKAN RECEIVER</button>
  <button onclick="startAudio()">🎵 AKTIFKAN AUDIO</button>
  <button onclick="stopAudio()">⏹ STOP AUDIO</button>
</div>
</div>

<script type="module">
import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,ref,set,get,onValue,onChildAdded,push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* =========================
   GANTI DENGAN CONFIG FIREBASE
========================= */

const firebaseConfig={
 apiKey:"ISI_API_KEY",
 authDomain:"ISI_PROJECT.firebaseapp.com",
 databaseURL:"https://ISI_PROJECT-default-rtdb.firebaseio.com",
 projectId:"ISI_PROJECT",
 storageBucket:"ISI_PROJECT.appspot.com",
 messagingSenderId:"ISI_SENDER_ID",
 appId:"ISI_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* CHANNEL RAHASIA */
const CHANNEL="AVEDOW_AUDIO_MAIN";

let pc=null;
let localStream=null;
let sessionId=null;
let pendingCandidates=[];

const status=document.getElementById("status");

function setStatus(x){
 status.textContent=x;
}

window.connect=async function(){

 try{

  setStatus("🟡 MENYIAPKAN...");

  /*
   * AUDIO HARUS DIMINTA SEBELUM OFFER
   */
  localStream=await navigator.mediaDevices.getDisplayMedia({
   video:true,
   audio:true
  });

  const audioTracks=localStream.getAudioTracks();

  if(!audioTracks.length){
   alert("Browser tidak memberikan audio sistem.");
   return;
  }

  pc=new RTCPeerConnection({
   iceServers:[
    {urls:"stun:stun.l.google.com:19302"}
   ]
  });

  audioTracks.forEach(track=>{
   pc.addTrack(track,localStream);
  });

  pc.onconnectionstatechange=()=>{
   if(pc.connectionState==="connected")
    setStatus("🟢 RECEIVER TERHUBUNG");

   if(pc.connectionState==="connecting")
    setStatus("🔵 MENGHUBUNGKAN...");

   if(pc.connectionState==="disconnected")
    setStatus("🟠 TERPUTUS");

   if(pc.connectionState==="failed")
    setStatus("🔴 GAGAL");
  };

  sessionId=Date.now().toString();

  const base=`avedow/${CHANNEL}/sessions/${sessionId}`;

  const offerRef=ref(db,`${base}/offer`);
  const answerRef=ref(db,`${base}/answer`);
  const txCandidatesRef=ref(db,`${base}/txCandidates`);
  const rxCandidatesRef=ref(db,`${base}/rxCandidates`);

  pc.onicecandidate=e=>{
   if(e.candidate){
    push(txCandidatesRef,e.candidate.toJSON());
   }
  };

  onChildAdded(rxCandidatesRef,async snap=>{
   const candidate=new RTCIceCandidate(snap.val());

   if(pc.remoteDescription){
    await pc.addIceCandidate(candidate);
   }else{
    pendingCandidates.push(candidate);
   }
  });

  const offer=await pc.createOffer();

  await pc.setLocalDescription(offer);

  await set(offerRef,{
   type:offer.type,
   sdp:offer.sdp
  });

  await set(
   ref(db,`avedow/${CHANNEL}/activeSession`),
   sessionId
  );

  setStatus("🟡 MENUNGGU RECEIVER...");

  onValue(answerRef,async snap=>{

   const data=snap.val();

   if(!data || pc.remoteDescription)
    return;

   await pc.setRemoteDescription(
    new RTCSessionDescription(data)
   );

   for(const c of pendingCandidates){
    await pc.addIceCandidate(c);
   }

   pendingCandidates=[];
  });

 }catch(err){

  console.error(err);
  setStatus("🔴 ERROR");
  alert(err.message);

 }
};

window.startAudio=function(){
 if(localStream){
  localStream.getAudioTracks().forEach(t=>{
   t.enabled=true;
  });
 }
};

window.stopAudio=function(){
 if(localStream){
  localStream.getTracks().forEach(t=>t.stop());
  localStream=null;
 }
 if(pc){
  pc.close();
  pc=null;
 }
 setStatus("🔴 AUDIO STOP");
};

</script>
</body>
</html>
