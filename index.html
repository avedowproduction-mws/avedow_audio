<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AVEDOW Audio Mixer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div>
    <h1>AVEDOW</h1>
    <span>AUDIO MIXER</span>
  </div>

  <div class="topButtons">
    <button id="themeBtn">☀ / ☾</button>
    <button id="resetBtn">RESET</button>
  </div>

</header>


<main>

  <!-- PLAYER -->

  <section class="player panel">

    <div class="playerButtons">

      <label class="upload">

        ＋ MP3

        <input
          id="fileInput"
          type="file"
          accept="audio/*"
          multiple
          hidden
        >

      </label>

      <button id="playBtn">▶ PLAY</button>

      <button id="stopBtn">■ STOP</button>

    </div>


    <div class="nowPlaying">

      <strong id="trackName">
        Belum ada lagu
      </strong>

      <span id="time">
        00:00 / 00:00
      </span>

    </div>


    <div class="master">

      <span>MASTER</span>

      <input
        id="masterVolume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.8"
      >

      <b id="masterValue">
        80%
      </b>

    </div>

  </section>



  <div class="layout">


    <!-- PLAYLIST -->

    <aside class="panel playlist">

      <h2>PLAYLIST</h2>

      <div id="playlist"></div>


      <div class="youtube">

        <h2>YOUTUBE</h2>

        <p>
          Tempel URL YouTube untuk membuka player resmi.
        </p>

        <input
          id="youtubeURL"
          placeholder="https://youtube.com/watch?v=..."
        >

        <button id="youtubeBtn">
          BUKA YOUTUBE
        </button>

        <div id="youtubePlayer"></div>

      </div>

    </aside>



    <!-- CENTER -->

    <section class="center">


      <!-- ANALYZER -->

      <section class="panel analyzer">

        <div class="sectionTitle">

          <h2>SPECTRUM ANALYZER</h2>

          <span id="peak">
            PEAK -∞ dB
          </span>

        </div>

        <canvas id="spectrum"></canvas>

      </section>



      <!-- EQ -->

      <section class="panel equalizer">

        <div class="sectionTitle">

          <h2>10 BAND EQUALIZER</h2>

          <div class="presets">

            <button data-preset="flat">
              FLAT
            </button>

            <button data-preset="bass">
              BASS+
            </button>

            <button data-preset="vocal">
              VOCAL
            </button>

            <button data-preset="treble">
              TREBLE+
            </button>

            <button data-preset="loud">
              LOUD
            </button>

          </div>

        </div>


        <div id="eq"></div>

      </section>



      <!-- DSP -->

      <section class="panel dsp">

        <h2>DSP</h2>


        <div class="dspGrid">


          <label>

            GAIN

            <input
              id="gain"
              type="range"
              min="-12"
              max="12"
              step="0.1"
              value="0"
            >

            <output id="gainValue">
              0 dB
            </output>

          </label>


          <label>

            COMPRESSOR

            <input
              id="compressor"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.25"
            >

            <output id="compressorValue">
              25%
            </output>

          </label>


          <label>

            PAN

            <input
              id="pan"
              type="range"
              min="-1"
              max="1"
              step="0.01"
              value="0"
            >

            <output id="panValue">
              CENTER
            </output>

          </label>


          <label>

            REVERB

            <input
              id="reverb"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            >

            <output id="reverbValue">
              0%
            </output>

          </label>


          <label>

            DELAY

            <input
              id="delay"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            >

            <output id="delayValue">
              0%
            </output>

          </label>


        </div>

      </section>


    </section>



    <!-- MIXER -->

    <aside class="panel mixer">

      <h2>MIXER</h2>


      <div class="channel">

        <strong>MUSIC</strong>


        <div class="meters">

          <div>
            <span id="meterL"></span>
          </div>

          <div>
            <span id="meterR"></span>
          </div>

        </div>


        <input
          id="channelVolume"
          class="fader"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
        >


        <span id="channelValue">
          100%
        </span>


        <button id="muteBtn">
          MUTE
        </button>

      </div>

    </aside>

  </div>

</main>


<footer>

  <span>
    AVEDOW AUDIO MIXER
  </span>

  <span>
    Web Audio • GitHub Pages
  </span>

</footer>


<script src="app.js"></script>

</body>
            </html>
