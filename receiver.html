<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVEDOW RECEIVER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b10;color:#fff;
 font-family:Arial,sans-serif
}
.wrap{max-width:900px;margin:auto;padding:15px}
h1{text-align:center;color:#00e5ff}
.card{
 background:#111720;border:1px solid #26313d;
 border-radius:16px;padding:15px;margin:12px 0
}
#status{text-align:center;font-weight:bold;margin:10px}
canvas{
 width:100%;height:180px;
 background:#05070a;border-radius:10px
}
input[type=range]{width:100%}
.eq{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:10px
}
.band{text-align:center}
.band input{
 writing-mode:vertical-lr;
 direction:rtl;
 height:130px
}
button{
 width:100%;padding:14px;
 border:0;border-radius:10px;
 background:#00a8ff;color:white;
 font-weight:bold
}
</style>
</head>

<body>

<div class="wrap">

<h1>AVEDOW RECEIVER</h1>

<div class="card">
<div id="status">🔴 MENUNGGU TRANSMITTER</div>
<canvas id="spectrum"></canvas>
</div>

<div class="card">
<h3>10 BAND EQ</h3>

<div class="eq">

<div class="band">31<br>
<input type="range" min="-12" max="12" value="0" data-f="31">
</div>

<div class="band">63<br>
<input type="range" min="-12" max="12" value="0" data-f="63">
</div>

<div class="band">125<br>
<input type="range" min="-12" max="12" value="0" data-f="125">
</div>

<div class="band">250<br>
<input type="range" min="-12" max="12" value="0" data-f="250">
</div>

<div class="band">500<br>
<input type="range" min="-12" max="12" value="0" data-f="500">
</div>

<div class="band">1K<br>
<input type="range" min="-12" max="12" value="0" data-f="1000">
</div>

<div class="band">2K<br>
<input type="range" min="-12" max="12" value="0" data-f="2000">
</div>

<div class="band">4K<br>
<input type="range" min="-12" max="12" value="0" data-f="4000">
</div>

<div class="band">8K<br>
<input type="range" min="-12" max="12" value="0" data-f="8000">
</div>

<div class="band">16K<br>
<input type="range" min="-12" max="12" value="0" data-f="16000">
</div>

</div>
</div>

<div class="card">

<h3>MASTER</h3>

<input id="master" type="range"
min="0" max="1" step=".01" value=".8">

<h3>COMPRESSOR</h3>

<input id="compressor" type="range"
min="0" max="1" step=".01" value=".5">

<h3>REVERB</h3>

<input id="reverb" type="range"
min="0" max="1" step=".01" value="0">

<h3>DELAY</h3>

<input id="delay" type="range"
min="0" max=".8" step=".01" value="0">

</div>

</div>

<audio id="audio" autoplay playsinline></audio>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,ref,onValue,onChildAdded
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig={
 apiKey:"ISI_API_KEY",
 authDomain:"ISI_PROJECT.firebaseapp.com",
 databaseURL:"https://ISI_PROJECT-default-rtdb.firebaseio.com",
 projectId:"ISI_PROJECT",
 storageBucket:"ISI_PROJECT.appspot.com",
 messagingSenderId:"ISI_SENDER_ID",
 appId:"ISI_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const CHANNEL="AVEDOW_AUDIO_MAIN";

const status=document.getElementById("status");
const audio=document.getElementById("audio");

let pc=null;
let currentSession=null;

let ctx;
let source;
let analyser;
let compressor;
let master;
let delayNode;
let delayGain;

const eqFreq=[
 31,63,125,250,500,
 1000,2000,4000,8000,16000
];

let eqNodes=[];

function initAudio(){

 if(ctx)return;

 ctx=new AudioContext();

 source=ctx.createMediaElementSource(audio);

 let node=source;

 eqFreq.forEach(freq=>{

  const filter=ctx.createBiquadFilter();

  filter.type="peaking";
  filter.frequency.value=freq;
  filter.Q.value=1;
  filter.gain.value=0;

  node.connect(filter);
  node=filter;

  eqNodes.push(filter);
 });

 compressor=ctx.createDynamicsCompressor();

 compressor.threshold.value=-18;
 compressor.knee.value=20;
 compressor.ratio.value=4;
 compressor.attack.value=.003;
 compressor.release.value=.25;

 node.connect(compressor);

 delayNode=ctx.createDelay(2);
 delayNode.delayTime.value=.25;

 delayGain=ctx.createGain();
 delayGain.gain.value=0;

 master=ctx.createGain();
 master.gain.value=.8;

 analyser=ctx.createAnalyser();
 analyser.fftSize=2048;

 compressor.connect(master);

 master.connect(analyser);
 analyser.connect(ctx.destination);

 compressor.connect(delayNode);
 delayNode.connect(delayGain);
 delayGain.connect(master);
}

function draw(){

 if(!analyser){
  requestAnimationFrame(draw);
  return;
 }

 const canvas=document.getElementById("spectrum");
 const c=canvas.getContext("2d");

 const data=new Uint8Array(
  analyser.frequencyBinCount
 );

 analyser.getByteFrequencyData(data);

 c.clearRect(0,0,canvas.width,canvas.height);

 const w=canvas.width/data.length;

 for(let i=0;i<data.length;i++){

  const h=data[i]/255*canvas.height;

  c.fillStyle="#00e5ff";

  c.fillRect(
   i*w,
   canvas.height-h,
   Math.max(1,w),
   h
  );
 }

 requestAnimationFrame(draw);
}

function setupEQ(){

 document.querySelectorAll(".band input")
 .forEach((slider,i)=>{

  slider.addEventListener("input",()=>{
   if(eqNodes[i]){
    eqNodes[i].gain.value=
     Number(slider.value);
   }
  });

 });

 document.getElementById("master")
 .oninput=e=>{
  if(master)
   master.gain.value=e.target.value;
 };

 document.getElementById("compressor")
 .oninput=e=>{
  if(compressor){
   compressor.ratio.value=
    1+Number(e.target.value)*19;
  }
 };

 document.getElementById("reverb")
 .oninput=e=>{
  if(delayGain)
   delayGain.gain.value=
    Number(e.target.value)*.5;
 };

 document.getElementById("delay")
 .oninput=e=>{
  if(delayNode)
   delayNode.delayTime.value=
    Number(e.target.value);
 };
}

setupEQ();
draw();


/* ======================
   FIREBASE / WEBRTC
====================== */

onValue(
 ref(db,`avedow/${CHANNEL}/activeSession`),
 async snap=>{

  const session=snap.val();

  if(!session)return;

  if(session===currentSession)return;

  currentSession=session;

  connectToTransmitter(session);
 }
);


async function connectToTransmitter(session){

 try{

  status.textContent="🔵 MENGHUBUNGKAN...";

  const base=
   `avedow/${CHANNEL}/sessions/${session}`;

  const offerRef=ref(db,`${base}/offer`);
  const answerRef=ref(db,`${base}/answer`);

  const txCandidatesRef=
   ref(db,`${base}/txCandidates`);

  const rxCandidatesRef=
   ref(db,`${base}/rxCandidates`);

  pc=new RTCPeerConnection({

   iceServers:[
    {urls:"stun:stun.l.google.com:19302"}
   ]

  });

  pc.onconnectionstatechange=()=>{

   if(pc.connectionState==="connected")
    status.textContent=
     "🟢 TRANSMITTER TERHUBUNG";

   if(pc.connectionState==="disconnected")
    status.textContent="🟠 TERPUTUS";

   if(pc.connectionState==="failed")
    status.textContent="🔴 GAGAL";
  };


  pc.ontrack=async event=>{

   audio.srcObject=event.streams[0];

   initAudio();

   try{
    await ctx.resume();
    await audio.play();
   }catch(e){
    console.log(e);
   }

  };


  pc.onicecandidate=e=>{

   if(e.candidate){

    import(
     "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
    ).then(({push})=>{
     push(
      rxCandidatesRef,
      e.candidate.toJSON()
     );
    });

   }

  };


  const offerSnap=await new Promise(resolve=>{

   onValue(
    offerRef,
    s=>resolve(s),
    {onlyOnce:true}
   );

  });

  const offer=offerSnap.val();

  if(!offer)return;

  await pc.setRemoteDescription(
   new RTCSessionDescription(offer)
  );


  onChildAdded(
   txCandidatesRef,
   async snap=>{

    try{

     await pc.addIceCandidate(
      new RTCIceCandidate(snap.val())
     );

    }catch(e){
     console.log(e);
    }

   }
  );


  const answer=await pc.createAnswer();

  await pc.setLocalDescription(answer);

  const {set}=await import(
   "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
  );

  await set(answerRef,{
   type:answer.type,
   sdp:answer.sdp
  });

 }catch(err){

  console.error(err);

  status.textContent="🔴 ERROR";

 }

}

</script>
</body>
</html>
