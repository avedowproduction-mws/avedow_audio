<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AVEDOW RECEIVER</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#070a0f;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 padding:18px;
 text-align:center;
 background:#10151c;
 border-bottom:1px solid #27303c;
}

h1{
 margin:0;
 font-size:24px;
}

.sub{
 color:#8995a5;
 font-size:12px;
 margin-top:5px;
}

.wrap{
 max-width:850px;
 margin:auto;
 padding:15px;
}

.card{
 background:#111720;
 border:1px solid #28313c;
 border-radius:15px;
 padding:15px;
 margin-bottom:15px;
}

input{
 width:100%;
 padding:13px;
 border-radius:10px;
 border:1px solid #384351;
 background:#080c11;
 color:white;
}

button{
 padding:12px 16px;
 border:0;
 border-radius:9px;
 background:#263241;
 color:white;
 font-weight:bold;
 margin:4px;
}

.primary{
 background:#1677ff;
}

.green{
 background:#087f5b;
}

.status{
 padding:12px;
 border-radius:10px;
 background:#171d26;
 text-align:center;
 margin-top:10px;
}

.song{
 text-align:center;
 font-size:18px;
 color:#4da3ff;
}

.eq{
 display:grid;
 grid-template-columns:repeat(10,1fr);
 gap:7px;
 height:260px;
 align-items:center;
}

.band{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:7px;
}

.band input{
 writing-mode:vertical-lr;
 direction:rtl;
 height:190px;
 width:25px;
 padding:0;
}

.freq{
 font-size:10px;
 color:#8d98a8;
}

canvas{
 width:100%;
 height:180px;
 background:#05070a;
 border-radius:10px;
}

.slider{
 width:100%;
}

h2{
 font-size:15px;
 margin-top:0;
}

</style>
</head>

<body>

<header>

<h1>AVEDOW RECEIVER</h1>

<div class="sub">
AUDIO DSP RECEIVER
</div>

</header>

<div class="wrap">

<div class="card">

<h2>ROOM</h2>

<button
class="primary"
onclick="createRoom()">
CREATE ROOM
</button>

<div
id="roomCode"
style="
font-size:30px;
text-align:center;
margin:15px;
letter-spacing:5px;
">
------
</div>

<div
id="status"
class="status">
WAITING
</div>

</div>

<div class="card">

<h2>NOW PLAYING</h2>

<div
id="song"
class="song">
Belum menerima lagu
</div>

</div>

<div class="card">

<h2>SPECTRUM ANALYZER</h2>

<canvas id="spectrum"></canvas>

</div>

<div class="card">

<h2>10 BAND EQUALIZER</h2>

<div
id="eq"
class="eq">
</div>

</div>

<div class="card">

<h2>COMPRESSOR</h2>

<input
id="compressor"
class="slider"
type="range"
min="0"
max="100"
value="50"
oninput="updateDSP()">

</div>

<div class="card">

<h2>REVERB</h2>

<input
id="reverb"
class="slider"
type="range"
min="0"
max="100"
value="0"
oninput="updateDSP()">

</div>

<div class="card">

<h2>DELAY</h2>

<input
id="delay"
class="slider"
type="range"
min="0"
max="100"
value="0"
oninput="updateDSP()">

</div>

<div class="card">

<h2>MASTER</h2>

<input
id="master"
class="slider"
type="range"
min="0"
max="100"
value="100"
oninput="updateDSP()">

</div>

</div>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
 getDatabase,
 ref,
 set,
 get,
 onValue
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig={

 apiKey:"YOUR_FIREBASE_API_KEY",

 authDomain:
 "YOUR_PROJECT.firebaseapp.com",

 databaseURL:
 "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

 projectId:
 "YOUR_PROJECT",

 storageBucket:
 "YOUR_PROJECT.firebasestorage.app",

 messagingSenderId:
 "YOUR_SENDER_ID",

 appId:
 "YOUR_APP_ID"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* =================================
   VARIABLES
================================= */

let roomCode="";
let peer=null;

let audioContext=null;

let source=null;

let analyser=null;

let masterGain=null;

let compressorNode=null;

let delayNode=null;

let delayGain=null;

let eqNodes=[];


/* =================================
   EQ FREQUENCIES
================================= */

const frequencies=[
 31,
 63,
 125,
 250,
 500,
 1000,
 2000,
 4000,
 8000,
 16000
];


/* =================================
   CREATE EQ
================================= */

const eqBox=
 document.getElementById("eq");

frequencies.forEach((freq,i)=>{

 const div=
 document.createElement("div");

 div.className="band";

 div.innerHTML=`

 <input
 id="eq${i}"
 type="range"
 min="-12"
 max="12"
 value="0"
 step="0.5">

 <div class="freq">
 ${freq>=1000 ? freq/1000+"k" : freq}
 </div>

 `;

 eqBox.appendChild(div);

});


/* =================================
   CREATE ROOM
================================= */

window.createRoom=async function(){

 roomCode=
 Math.random()
 .toString(36)
 .substring(2,8)
 .toUpperCase();

 document.getElementById("roomCode")
 .innerText=roomCode;

 await set(
  ref(db,"rooms/"+roomCode),
  {
   receiver:true,
   online:true,
   created:Date.now()
  }
 );

 document.getElementById("status")
 .innerText=
 "WAITING FOR TRANSMITTER";

 startReceiver();

};


/* =================================
   WEBRTC RECEIVER
================================= */

async function startReceiver(){

 peer=
 new RTCPeerConnection({

  iceServers:[
   {
    urls:"stun:stun.l.google.com:19302"
   }
  ]

 });


 peer.ontrack=event=>{

  const stream=event.streams[0];

  setupAudio(stream);

 };


 peer.onicecandidate=async event=>{

  if(event.candidate){

   await set(
    ref(
     db,
     "rooms/"+roomCode+
     "/receiverCandidates/"+
     Date.now()
    ),
    event.candidate.toJSON()
   );

  }

 };


 const offer=
 await peer.createOffer({
  offerToReceiveAudio:true
 });

 await peer.setLocalDescription(offer);


 await set(
  ref(
   db,
   "rooms/"+roomCode+
   "/receiverOffer"
  ),
  {
   type:offer.type,
   sdp:offer.sdp
  }
 );


 onValue(
  ref(
   db,
   "rooms/"+roomCode+
   "/transmitterAnswer"
  ),
  async snap=>{

   const answer=snap.val();

   if(!answer) return;

   if(
    peer.signalingState !==
    "stable"
   ){

    await peer.setRemoteDescription(
     answer
    );

    document.getElementById("status")
     .innerText="CONNECTED";

   }

  }
 );


 onValue(
  ref(
   db,
   "rooms/"+roomCode+
   "/transmitterCandidates"
  ),
  snap=>{

   snap.forEach(async child=>{

    try{

     await peer.addIceCandidate(
      new RTCIceCandidate(
       child.val()
      )
     );

    }catch(e){}

   });

  }
 );


 listenCommands();

}


/* =================================
   AUDIO DSP
================================= */

async function setupAudio(stream){

 if(audioContext)
  await audioContext.close();

 audioContext=
 new AudioContext();

 source=
 audioContext.createMediaStreamSource(
  stream
 );


 /* EQ */

 eqNodes=[];

 frequencies.forEach(freq=>{

  const filter=
   audioContext.createBiquadFilter();

  filter.type="peaking";

  filter.frequency.value=freq;

  filter.Q.value=1;

  filter.gain.value=0;

  eqNodes.push(filter);

 });


 /* COMPRESSOR */

 compressorNode=
  audioContext.createDynamicsCompressor();

 compressorNode.threshold.value=-24;

 compressorNode.knee.value=30;

 compressorNode.ratio.value=4;

 compressorNode.attack.value=0.003;

 compressorNode.release.value=0.25;


 /* DELAY */

 delayNode=
  audioContext.createDelay(1);

 delayNode.delayTime.value=0.2;


 delayGain=
  audioContext.createGain();

 delayGain.gain.value=0;


 /* MASTER */

 masterGain=
  audioContext.createGain();

 masterGain.gain.value=1;


 /* ANALYSER */

 analyser=
  audioContext.createAnalyser();

 analyser.fftSize=2048;


 /* CONNECT EQ */

 let current=source;

 eqNodes.forEach(node=>{

  current.connect(node);

  current=node;

 });


 current.connect(compressorNode);

 compressorNode.connect(analyser);

 analyser.connect(masterGain);

 compressorNode.connect(delayNode);

 delayNode.connect(delayGain);

 delayGain.connect(masterGain);

 masterGain.connect(
  audioContext.destination
 );


 drawSpectrum();

}


/* =================================
   DSP CONTROLS
================================= */

window.updateDSP=function(){

 if(!audioContext)
  return;


 frequencies.forEach((freq,i)=>{

  const value=
   Number(
    document.getElementById("eq"+i)
    .value
   );

  if(eqNodes[i])
   eqNodes[i].gain.value=value;

 });


 const comp=
  Number(
   document.getElementById("compressor")
   .value
  );


 if(compressorNode){

  compressorNode.threshold.value=
   -5-(comp*0.5);

 }


 const rev=
  Number(
   document.getElementById("reverb")
   .value
  );


 /* Reverb simulation */

 if(delayGain){

  delayGain.gain.value=
   rev/100*0.5;

 }


 const del=
  Number(
   document.getElementById("delay")
   .value
  );


 if(delayNode){

  delayNode.delayTime.value=
   del/100*0.7;

 }


 const master=
  Number(
   document.getElementById("master")
   .value
  );


 if(masterGain){

  masterGain.gain.value=
   master/100;

 }

};


/* =================================
   SPECTRUM
================================= */

function drawSpectrum(){

 const canvas=
  document.getElementById("spectrum");

 const ctx=
  canvas.getContext("2d");

 function draw(){

  requestAnimationFrame(draw);

  if(!analyser)
   return;

  const buffer=
   new Uint8Array(
    analyser.frequencyBinCount
   );

  analyser.getByteFrequencyData(
   buffer
  );

  ctx.clearRect(
   0,
   0,
   canvas.width,
   canvas.height
  );

  const barWidth=
   canvas.width/
   buffer.length*3;

  let x=0;

  for(let i=0;
      i<buffer.length;
      i+=3){

   const h=
    buffer[i]/
    255*
    canvas.height;

   ctx.fillRect(
    x,
    canvas.height-h,
    barWidth,
    h
   );

   x+=barWidth+1;

  }

 }

 draw();

}


/* =================================
   REMOTE COMMANDS
================================= */

function listenCommands(){

 onValue(
  ref(
   db,
   "rooms/"+roomCode+"/command"
  ),
  snap=>{

   const cmd=snap.val();

   if(!cmd)
    return;


   if(cmd.type==="load"){

    document.getElementById("song")
     .innerText=
      cmd.data?.title ||
      "YouTube";

   }


   if(cmd.type==="play"){

    /* Audio stream itself
       continues through WebRTC */

   }


   if(cmd.type==="pause"){

   }


   if(cmd.type==="stop"){

   }


   if(cmd.type==="volume"){

    if(masterGain){

     masterGain.gain.value=
      Number(cmd.data.value)/100;

     document.getElementById("master")
      .value=
      cmd.data.value;

    }

   }

  }
 );

}

</script>

</body>
</html>
